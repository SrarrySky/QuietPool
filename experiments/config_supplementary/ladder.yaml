wallets: 5
funding: {fixed_amount: 10000, min_amount: 5000, max_amount: 15000}

# Directed Top Player grid: each spec deviates one factor at a time from the
# honest baseline (G0) toward a declared MAR indicator, so effects stay
# attributable. TP_b and TP_c/TP_d intentionally pull in opposite directions:
# symmetric round-trip keeps (b) silent while exposing (c)/(d), whereas a
# one-sided run dodges (c)/(d) at the cost of price impact (b). No single path
# can silence every wash-trading statistic at once.

specs:
  # General Player baseline == Main experiment M0.
  - name: G0
    target: baseline
    min_interval_sec: 30
    base_interval_sec: 30
    max_interval_sec: 30
    available_wallet_count: 1

  # Dodge (a) volume share: small absolute size + bounded organic participation.
  - name: TP_a
    target: a
    max_amount_usdt: 200
    organic_input: true
    max_organic_volume_participation_bps: 500
    min_interval_sec: 10
    available_wallet_count: 1

  # Prove (b) is silent for symmetric wash trading: small symmetric round-trip.
  - name: TP_b
    target: b
    max_amount_usdt: 200
    min_interval_sec: 30
    base_interval_sec: 30
    max_interval_sec: 30
    available_wallet_count: 1

  # Dodge (c) net-position: one-sided nominal inventory run (large band).
  - name: TP_c
    target: c
    target_test_inventory_usd: 50000
    band: [50000, 150000]
    available_wallet_count: 1

  # Dodge (d) reversal: push reversal cadence beyond the 600s matching window.
  - name: TP_d
    target: d
    min_interval_sec: 600
    base_interval_sec: 600
    max_interval_sec: 600
    available_wallet_count: 1

  # Dodge (e) burst: fixed uniform cadence (revert component still fires).
  - name: TP_e
    target: e
    min_interval_sec: 30
    base_interval_sec: 30
    max_interval_sec: 30
    available_wallet_count: 1

  # Neutralise the g1 linked-wallet diagnostic: single wallet, no bundle.
  - name: TP_g1
    target: g1
    available_wallet_count: 1
    bundle_threshold_usdt: 100000

  # Combined a + c + d evasion; expected to trade b impact against quietness.
  - name: TP_acd
    target: acd
    max_amount_usdt: 200
    organic_input: true
    max_organic_volume_participation_bps: 500
    target_test_inventory_usd: 50000
    band: [50000, 150000]
    min_interval_sec: 600
    base_interval_sec: 600
    max_interval_sec: 600
    available_wallet_count: 1
