[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quiet-pool"
version = "0.1.0"
description = "Historical replay of AMM market-abuse indicators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "pyarrow>=17,<27", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "Jinja2>=3.1,<4", "pydantic>=2.7,<3", "httpx>=0.27,<1", "eth-abi>=5,<7", "eth-utils>=5,<7", "eth-hash[pycryptodome]>=0.7,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
redteam = "experiments.run:main"

[tool.setuptools.packages.find]
include = ["experiments*"]
namespaces = true

[tool.setuptools.package-data]
"experiments" = ["config/*.yaml", "config/*.txt", "config/study_evidence/*.csv", "config/study_evidence/*.json", "docs/*.md", "vendor/README.md", "vendor/manifest.json", "vendor/backend/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["experiments/tests"]

[tool.ruff]
exclude = ["experiments/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
